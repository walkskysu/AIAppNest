name: Windows internal candidate
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  candidate:
    runs-on: windows-2025
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: npm
      - run: npm install --global npm@11.17.0
      - run: npm ci
      - run: node node_modules/electron/install.js
      - run: npm test
      - name: Upload internal candidate only (no public release)
        uses: actions/upload-artifact@v4
        with:
          name: windows-internal-candidate
          path: |
            release-output/candidate-*/*-internal-setup.exe
            release-output/candidate-*/*-internal.zip
            release-output/candidate-*/SHA256SUMS.txt
            release-output/candidate-*/candidate.json
            release-output/candidate-*/package-gate.txt
            release-output/candidate-*/signing-report.json
            release-output/service-benchmark.json
          retention-days: 30
          if-no-files-found: error
